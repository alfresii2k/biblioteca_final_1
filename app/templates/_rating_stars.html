{% macro rating_stars(value, label='') -%}
{% set score = value|float %}
<span class="rating-stars" role="img" aria-label="{{ label or ('Calificación ' ~ (score|round(2)) ~ ' de 5') }}">
    {% for estrella in range(1, 6) %}
    <span class="rating-star" style="--star-fill: {% if score >= estrella %}100{% elif score > estrella - 1 %}{{ (score - estrella + 1) * 100 }}{% else %}0{% endif %}%;">
        <i class="fas fa-star rating-star-empty" aria-hidden="true"></i>
        <i class="fas fa-star rating-star-fill" aria-hidden="true"></i>
    </span>
    {% endfor %}
</span>
{%- endmacro %}
