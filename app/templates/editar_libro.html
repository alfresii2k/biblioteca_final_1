{% extends 'layout.html' %}
{% block title %}Editar Libro - INKVERSE{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card p-4 p-md-5 mx-auto shadow-sm" style="max-width: 700px; background-color: var(--card); border: 1px solid var(--border);">
        
        <!-- Icono de Encabezado -->
        <div class="text-center mb-3">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-3" style="background-color: var(--secondary);">
                <i class="fas fa-edit" style="font-size: 2.5rem; color: var(--accent);"></i>
            </div>
        </div>

        <h3 class="text-center mb-4 fw-bold" style="color: var(--foreground);">
            <i class="fas fa-pencil-alt me-2" style="color: var(--primary);"></i>Editar Libro
        </h3>

        <!-- Formulario -->
        <form method="POST" enctype="multipart/form-data" novalidate>
            
            <div class="mb-3">
                <label for="titulo" class="form-label fw-semibold" style="color: var(--foreground);">Título</label>
                <input type="text" class="form-control" id="titulo" name="titulo" value="{{ libro.titulo }}" required>
            </div>

            <div class="mb-3">
                <label for="autor" class="form-label fw-semibold" style="color: var(--foreground);">Autor</label>
                <input type="text" class="form-control" id="autor" name="autor" value="{{ libro.autor }}" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="año" class="form-label fw-semibold" style="color: var(--foreground);">Año</label>
                    <input type="text" class="form-control" id="año" name="año" value="{{ libro.anio }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="isbn" class="form-label fw-semibold" style="color: var(--foreground);">ISBN</label>
                    <input type="text" class="form-control" id="isbn" name="isbn" value="{{ libro.isbn }}">
                </div>
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label fw-semibold" style="color: var(--foreground);">Categoría</label>
                <input type="text" class="form-control" id="categoria" name="categoria" value="{{ libro.categoria }}">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="edicion" class="form-label fw-semibold" style="color: var(--foreground);">Edición</label>
                    <input type="text" class="form-control" id="edicion" name="edicion" value="{{ libro.edicion }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="editorial" class="form-label fw-semibold" style="color: var(--foreground);">Editorial</label>
                    <input type="text" class="form-control" id="editorial" name="editorial" value="{{ libro.editorial }}">
                </div>
            </div>

            <div class="mb-3">
                <label for="sede" class="form-label fw-semibold" style="color: var(--foreground);">Sede</label>
                <select class="form-select" id="sede" name="sede" required>
                    <option value="A" {% if libro.sede == 'A' %}selected{% endif %}>Sede A</option>
                    <option value="B" {% if libro.sede == 'B' %}selected{% endif %}>Sede B</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="cantidad_total" class="form-label fw-semibold" style="color: var(--foreground);">Cantidad total</label>
                    <input type="number" class="form-control" id="cantidad_total" name="cantidad_total" min="1"
                        value="{{ libro.cantidad_total or 1 }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="cantidad_disponible" class="form-label fw-semibold" style="color: var(--foreground);">Cantidad disponible</label>
                    <input type="number" class="form-control" id="cantidad_disponible" name="cantidad_disponible"
                        min="0" value="{{ libro.cantidad_disponible or 1 }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold" style="color: var(--foreground);">Estado actual</label>
                    <input type="text" class="form-control"
                        value="{% if libro.cantidad_disponible > 2 %}Disponible{% elif libro.cantidad_disponible > 0 %}Pocas unidades{% else %}Agotado{% endif %}"
                        style="background-color: var(--secondary); border-color: var(--border); color: var(--muted-foreground);"
                        disabled>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="seccion" class="form-label fw-semibold" style="color: var(--foreground);">Sección</label>
                    <input type="text" class="form-control" id="seccion" name="seccion" value="{{ libro.seccion or '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="estante" class="form-label fw-semibold" style="color: var(--foreground);">Estante</label>
                    <input type="text" class="form-control" id="estante" name="estante" value="{{ libro.estante or '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="fila" class="form-label fw-semibold" style="color: var(--foreground);">Fila</label>
                    <input type="text" class="form-control" id="fila" name="fila" value="{{ libro.fila or '' }}">
                </div>
            </div>

            <div class="mb-4">
                <label for="descripcion" class="form-label fw-semibold" style="color: var(--foreground);">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="4">{{ libro.descripcion }}</textarea>
            </div>

            <div class="mb-4">
                <label for="imagen" class="form-label fw-semibold" style="color: var(--foreground);">Cambiar imagen del libro (opcional)</label>
                <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                <small class="d-block mt-2" style="color: var(--muted-foreground);">PNG, JPG, GIF, WEBP, BMP o AVIF. Máximo 5 MB.</small>
                
                {% if libro.imagen %}
                <div class="mt-3 p-3 rounded" style="background-color: var(--secondary); border: 1px solid var(--border);">
                    <small class="d-block mb-2 fw-semibold" style="color: var(--muted-foreground);">Imagen actual:</small>
                    <img src="{{ url_for('static', filename=libro.imagen) }}" alt="Imagen del libro"
                        class="img-fluid rounded shadow-sm" style="max-height: 180px; object-fit: cover; border: 1px solid var(--border);">
                </div>
                {% endif %}
            </div>

            <hr style="border-color: var(--border);" class="my-4">

            <!-- Botones de Acción -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary py-2 fw-semibold">
                    <i class="fas fa-save me-2"></i>Guardar Cambios
                </button>
                <a href="{{ url_for('libros.books') }}" class="btn btn-outline-light py-2 text-center" style="color: var(--foreground); border-color: var(--border);">
                    <i class="fas fa-times me-2"></i>Cancelar
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
