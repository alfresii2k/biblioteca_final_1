{% extends "layout.html" %}
{% block title %}Agregar Libro - INKVERSE{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card p-4 p-md-5 mx-auto shadow-sm" style="max-width: 700px; background-color: var(--card); border: 1px solid var(--border);">
        
        <!-- Icono de Encabezado -->
        <div class="text-center mb-3">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-3" style="background-color: var(--secondary);">
                <i class="fas fa-book-medical" style="font-size: 2.5rem; color: var(--primary);"></i>
            </div>
        </div>

        <h3 class="text-center mb-4 fw-bold" style="color: var(--foreground);">
            <i class="fas fa-plus-circle me-2" style="color: var(--primary);"></i>Agregar un Nuevo Libro
        </h3>

        <!-- Mensaje de Error -->
        {% if error %}
        <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <!-- Formulario -->
        <form method="POST" enctype="multipart/form-data" novalidate>
            
            <div class="mb-3">
                <label for="titulo" class="form-label fw-semibold" style="color: var(--foreground);">Título del Libro</label>
                <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Ej. El Quijote" required>
            </div>

            <div class="mb-3">
                <label for="autor" class="form-label fw-semibold" style="color: var(--foreground);">Autor</label>
                <input type="text" class="form-control" id="autor" name="autor" placeholder="Ej. Miguel de Cervantes" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="año" class="form-label fw-semibold" style="color: var(--foreground);">Año de Publicación</label>
                    <input type="text" class="form-control" id="año" name="año" maxlength="4"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="YYYY" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="isbn" class="form-label fw-semibold" style="color: var(--foreground);">ISBN</label>
                    <input type="text" class="form-control" id="isbn" name="isbn" maxlength="13"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="13 dígitos" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label fw-semibold" style="color: var(--foreground);">Categoría</label>
                <input type="text" class="form-control" id="categoria" name="categoria"
                    placeholder="Ej. Novela, Ciencia Ficción" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="edicion" class="form-label fw-semibold" style="color: var(--foreground);">Edición</label>
                    <input type="text" class="form-control" id="edicion" name="edicion" placeholder="Ej. 1ª Edición" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="editorial" class="form-label fw-semibold" style="color: var(--foreground);">Editorial</label>
                    <input type="text" class="form-control" id="editorial" name="editorial" placeholder="Ej. Planeta" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="sede" class="form-label fw-semibold" style="color: var(--foreground);">Sede</label>
                <select class="form-select" id="sede" name="sede" required>
                    <option value="" selected disabled>Selecciona una sede</option>
                    <option value="A">Sede A</option>
                    <option value="B">Sede B</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="cantidad_total" class="form-label fw-semibold" style="color: var(--foreground);">Cantidad total</label>
                    <input type="number" class="form-control" id="cantidad_total" name="cantidad_total" min="1" value="1" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="cantidad_disponible" class="form-label fw-semibold" style="color: var(--foreground);">Cantidad disponible</label>
                    <input type="number" class="form-control" id="cantidad_disponible" name="cantidad_disponible" min="0" value="1" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="seccion" class="form-label fw-semibold" style="color: var(--foreground);">Sección</label>
                    <input type="text" class="form-control" id="seccion" name="seccion" placeholder="Ej. Literatura" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="estante" class="form-label fw-semibold" style="color: var(--foreground);">Estante</label>
                    <input type="text" class="form-control" id="estante" name="estante" placeholder="Ej. B" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="fila" class="form-label fw-semibold" style="color: var(--foreground);">Fila</label>
                    <input type="text" class="form-control" id="fila" name="fila" placeholder="Ej. 3">
                </div>
            </div>

            <div class="mb-4">
                <label for="descripcion" class="form-label fw-semibold" style="color: var(--foreground);">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="4"
                    placeholder="Ingresa una descripción del libro..." required></textarea>
            </div>

            <div class="mb-4">
                <label for="imagen" class="form-label fw-semibold" style="color: var(--foreground);">Imagen del libro</label>
                <input type="file" class="form-control" id="imagen" name="imagen" accept="image/png, image/jpeg, image/gif">
            </div>

            <hr style="border-color: var(--border);" class="my-4">

            <!-- Botones de Acción -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary py-2 fw-semibold">
                    <i class="fas fa-save me-2"></i>Guardar Libro
                </button>
                <a href="{{ url_for('libros.books') }}" class="btn btn-outline-light py-2 text-center" style="color: var(--foreground);">
                    <i class="fas fa-arrow-left me-2"></i>Cancelar
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
