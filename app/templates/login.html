{% extends "layout.html" %}
{% block title %}Iniciar Sesión - INKVERSE{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <!-- Inicio de sesión mediante identificación y contraseña. -->
        <div class="text-center mb-4">
            <i class="fas fa-sign-in-alt" style="font-size: 3rem; color: #085438;"></i>
        </div>
        <h3 class="text-center mb-4">Iniciar Sesión</h3>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" novalidate>
            <div class="mb-3">
                <label for="identificacion" class="form-label">Número de Identificación</label>
                <input type="text" class="form-control" id="identificacion" name="identificacion" maxlength="10"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="Ingresa tu número de ID"
                    required>
            </div>
            <div class="mb-4">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" name="contrasena"
                    placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted">¿No tienes cuenta?
                <a href="{{ url_for('auth.register') }}" class="text-decoration-none"
                    style="color: #085438; font-weight: 600;">Regístrate aquí</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
